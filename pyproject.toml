[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowers"
version = "0.1.0"
description = "Buscador local de flores con HNSW (SigLIP + EmbeddingGemma)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy",
    "scikit-learn",
    "pillow",
    "torch",
    "transformers",
    "sentence-transformers",
    "sentencepiece",
    "protobuf",
    "hnswlib",
    "streamlit",
    "plotly",
    "matplotlib",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: corpus real en Downloads; se omite si no está",
]
